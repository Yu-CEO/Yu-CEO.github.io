# CI/CD（自動チェックと自動公開）の設定：入口ページ（ブラウザで動くHTML/JS）
# もとにしたひな形：products/_templates/ci/web.yml
#
# GitHubにコードを上げるたびに、次を自動で実行する。
#   1. テスト（tests/ フォルダの *.test.js を node --test で実行）
#   2. 機密チェック（ci/confidential_check.py）
#   3. 1と2が合格し、main ブランチで、さらに「Web公開がオン」のときだけ、GitHub Pages に公開する
#
# 結果はリポジトリの「Actions」タブで見られる。✅なら合格、❌なら不合格。
#
# 機密の言葉は、このファイルには書かない。
#   Settings → Secrets and variables → Actions → Secrets に CONFIDENTIAL_WORDS（1行に1語）を登録する。
#   登録していないと、機密チェックは「NG」で止まる（登録忘れのまま合格にしないため）。
# Web公開をオンにする方法：
#   Settings → Secrets and variables → Actions → Variables に DEPLOY_PAGES = true を登録する。
#   Settings → Pages の「Source」は「GitHub Actions」にする（ブランチから直接公開しない）。
#   DEPLOY_PAGES を登録しなければ、公開の手順（deploy）は毎回「スキップ」になる。

name: CI

# いつ動かすか（pull_request_target は使わない：外部からの提案で権限つきの処理が動くのを防ぐ）
on:
  push:
    branches: [main]      # main に上げたとき
  pull_request:           # 変更の提案（プルリクエスト）を出したとき
  workflow_dispatch:      # 「Actions」タブから手で実行したいとき

# 全体の権限は「何もなし」にしておき、ジョブごとに必要な分だけ渡す
permissions: {}

jobs:
  # ---------------------------------------------------------------
  # ここから CI（自動チェック）
  # ---------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # コードを読むだけ（書き込みはしない）
    steps:
      # GitHubのサーバーにコードを持ってくる
      - uses: actions/checkout@v5

      # Node.js 20 を用意する（テストに使う。外部ライブラリは使わない）
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # tests/ の自動テストを実行する（手元では portal フォルダで `node --test`）
      - name: テスト
        run: node --test

      # Python を用意する（機密チェックのスクリプトに使う）
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 機密の言葉は Secrets（CONFIDENTIAL_WORDS）から環境変数で受け取る。ログに言葉そのものは出ない
      # --require-words：言葉のリストが空（Secrets の登録忘れ）なら失敗にする
      - name: 機密チェック
        env:
          CONFIDENTIAL_WORDS: ${{ secrets.CONFIDENTIAL_WORDS }}
        run: python ci/confidential_check.py --require-words

  # ---------------------------------------------------------------
  # ここから CD（自動公開）。チェックが合格し、main で、DEPLOY_PAGES が true のときだけ動く
  # ---------------------------------------------------------------
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read      # コードを読む
      pages: write        # GitHub Pages に公開する
      id-token: write     # 公開のときの本人確認に使う
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Node.js 20 を用意する（sitemap.xml を作るスクリプトに使う。外部ライブラリは使わない）
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # 公開するファイルだけを _site フォルダにまとめる
      # 入れるもの：index.html・robots.txt・css/・js/・diary/（日記のページとデータ）（assets/・images/ があればそれも）
      # 入れないもの：tests/・ci/・tools/・README.md・docs/・.github/
      # sitemap.xml はリポジトリに置かず、ここで diary/entries/index.json から作る（tools/build_sitemap.js。日付の形が違えば失敗して公開しない）
      - name: 公開するファイルをまとめる
        run: |
          mkdir _site
          cp index.html robots.txt _site/
          for dir in css js diary assets images; do
            if [ -d "$dir" ]; then cp -r "$dir" _site/; fi
          done
          node tools/build_sitemap.js _site
          # ページごとに CSS を1つ・JS を2つ（表示用・アクセス解析用）にまとめ、_site の HTML の読み込みを書き換える（通信の回数を減らして軽くする）
          # リポジトリの css/・js/ は機能ごとに分けたまま。読み込むファイルが見つからなければ失敗して公開しない
          node tools/build_bundle.js _site
          # 何を公開するかをログに残す（確認用）
          find _site -type f | sort

      # まとめたファイルを GitHub Pages 用に預ける
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # 公開する
      - id: deployment
        uses: actions/deploy-pages@v4
