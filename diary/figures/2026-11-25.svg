<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img" aria-labelledby="t">
<title id="t">60秒の動画のうち、見られたのは最初の3〜4秒</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b5f66"/></marker>
</defs>
<rect width="300" height="220" rx="12" fill="#f2f3f5"/>
<rect x="30" y="12" width="240" height="30" rx="15" fill="#0f1626"/>
<text x="150" y="27" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#ffffff">おすすめで約9割が届いた</text>
<line x1="150" y1="44" x2="150" y2="62" stroke="#5b5f66" stroke-width="2" marker-end="url(#ag)"/>
<text x="20" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f1626">動画の長さ 約60秒</text>
<rect x="20" y="90" width="260" height="26" rx="6" fill="#ffffff" stroke="#d9dbe0" stroke-width="1.5"/>
<rect x="20" y="90" width="16" height="26" rx="4" fill="#fbc531" stroke="#a14a00" stroke-width="1.5"/>
<line x1="28" y1="118" x2="28" y2="140" stroke="#a14a00" stroke-width="1.5"/>
<text x="20" y="156" font-family="sans-serif" font-size="14" font-weight="700" fill="#a14a00">見られたのは3〜4秒</text>
<text x="272" y="132" font-family="sans-serif" text-anchor="end" font-size="11" fill="#5b5f66">ここから先は見られていない</text>
<rect x="20" y="170" width="260" height="38" rx="10" fill="#ffffff" stroke="#d9dbe0" stroke-width="1.5"/>
<text x="150" y="189" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#0f1626">最後まで見た人は約1%</text>
</svg>
