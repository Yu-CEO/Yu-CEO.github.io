<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 284" role="img" aria-labelledby="t">
<title id="t">帯の答え合わせ：最初と見直し後</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b5f66"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker>
</defs>
<rect width="300" height="284" rx="12" fill="#f2f3f5"/>
<line x1="150" y1="14" x2="150" y2="270" stroke="#d9dbe0" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="27" y="10" width="100" height="30" rx="15" fill="#ffffff" stroke="#d9dbe0"/>
<text x="77" y="25" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#5b5f66">最初</text>
<rect x="173" y="10" width="100" height="30" rx="15" fill="#0f1626"/>
<text x="223" y="25" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#ffffff">見直し後</text>
<rect x="10" y="54" width="134" height="40" rx="10" fill="#ffffff" stroke="#d9dbe0" stroke-width="1.5"/>
<text x="77" y="74" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5b5f66">混ぜたデータの平均</text>
<line x1="77" y1="96" x2="77" y2="113" stroke="#5b5f66" stroke-width="2" marker-end="url(#ag)"/>
<rect x="10" y="116" width="134" height="40" rx="10" fill="#ffffff" stroke="#d9dbe0" stroke-width="1.5"/>
<text x="77" y="136" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5b5f66">計算を6通り調整</text>
<line x1="77" y1="158" x2="77" y2="175" stroke="#5b5f66" stroke-width="2" marker-end="url(#ag)"/>
<rect x="10" y="178" width="134" height="40" rx="10" fill="#ffffff" stroke="#d9dbe0" stroke-width="1.5"/>
<text x="77" y="198" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5b5f66">ほぼ変わらない</text>
<rect x="10" y="226" width="134" height="40" rx="10" fill="#ffffff" stroke="#a14a00" stroke-width="1.5"/>
<text x="77" y="246" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#a14a00">68%のはずが58%</text>
<rect x="156" y="54" width="134" height="40" rx="10" fill="#ffffff" stroke="#2563a8" stroke-width="1.5"/>
<text x="223" y="74" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#0f1626">ECBのデータだけ</text>
<line x1="223" y1="96" x2="223" y2="113" stroke="#2563a8" stroke-width="2" marker-end="url(#ab)"/>
<rect x="156" y="116" width="134" height="40" rx="10" fill="#ffffff" stroke="#2563a8" stroke-width="1.5"/>
<text x="223" y="136" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#0f1626">先は1〜4週間</text>
<line x1="223" y1="158" x2="223" y2="175" stroke="#2563a8" stroke-width="2" marker-end="url(#ab)"/>
<rect x="156" y="178" width="134" height="40" rx="10" fill="#ffffff" stroke="#2563a8" stroke-width="1.5"/>
<text x="223" y="198" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#0f1626">試算は約74%と約94%</text>
<rect x="156" y="226" width="134" height="40" rx="10" fill="#ffffff" stroke="#2563a8" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="223" y="246" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2563a8">実装はこれから</text>
</svg>
