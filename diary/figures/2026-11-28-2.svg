<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" role="img" aria-labelledby="t">
<title id="t">決定と、いまの結果</title>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563a8"/></marker>
</defs>
<rect width="300" height="190" rx="12" fill="#f2f3f5"/>
<rect x="30" y="12" width="240" height="72" rx="10" fill="#ffffff" stroke="#2563a8" stroke-width="1.5"/>
<text x="150" y="30" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5b5f66">Yuの決定</text>
<text x="150" y="50" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#0f1626">作る前に困りごとを聞く</text>
<text x="150" y="70" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#0f1626">漫画にして投稿</text>
<line x1="150" y1="86" x2="150" y2="108" stroke="#2563a8" stroke-width="2" marker-end="url(#ab)"/>
<rect x="30" y="114" width="240" height="64" rx="10" fill="#0f1626" stroke="#a14a00" stroke-width="2"/>
<text x="150" y="133" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#ffffff">結果</text>
<text x="150" y="157" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#fff3c4">数字はこれから</text>
</svg>
