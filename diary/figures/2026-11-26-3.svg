<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-labelledby="t">
<title id="t">どちらを先にする？</title>
<rect width="300" height="200" rx="12" fill="#f2f3f5"/>
<text x="150" y="20" font-family="sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1626">どちらを先にする？</text>
<rect x="10" y="34" width="134" height="100" rx="10" fill="#ffffff" stroke="#2563a8" stroke-width="1.5"/>
<text x="77" y="58" font-family="sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2563a8">先に稼ぐ</text>
<text x="77" y="92" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#0f1626">支払いと</text>
<text x="77" y="110" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#0f1626">お客さんの言葉</text>
<rect x="156" y="34" width="134" height="100" rx="10" fill="#ffffff" stroke="#2563a8" stroke-width="1.5"/>
<text x="223" y="58" font-family="sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#2563a8">先に知名度</text>
<text x="223" y="92" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#0f1626">知名度は</text>
<text x="223" y="110" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#0f1626">資産になる</text>
<rect x="40" y="148" width="220" height="40" rx="10" fill="#fff3c4" stroke="#a14a00" stroke-width="2"/>
<text x="150" y="173" font-family="sans-serif" text-anchor="middle" font-size="12" font-weight="700" fill="#a14a00">秘書の案：二者択一にしない</text>
</svg>
