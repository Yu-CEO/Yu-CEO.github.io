<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--
  diary/entry.html：経営会議の日記1件のページ（/diary/entry.html?date=YYYY-MM-DD）の骨組みだけを書くファイル。
  中身は js/diary_entry_view.js（旧形式）か js/diary_story_view.js（新しい形・図は diary/figures/ のSVGを <img> で表示）が、
  diary/entries/ のその日のデータから作る（流れは js/diary_entry_main.js）。
  日付が正しくない・見つからないときは「この日の日記は見つかりませんでした」と一覧へのリンクを出す。
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>経営会議の日記｜Yu</title>
<!-- 変数（variables.css）を先に読み込む。ほかのCSSがその値を使うため -->
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/hero.css">
<link rel="stylesheet" href="../css/diary.css">
<link rel="stylesheet" href="../css/diary_entry.css">
</head>
<body>

<!-- 上部の固定バー（入口ページと同じ）。「Yu」で入口ページへ、TikTok の URL は js/site_config.js から入る -->
<nav class="bar" aria-label="サイトのメニュー">
  <a class="bar-logo" href="../">Yu</a>
  <a class="bar-link" id="bar-tiktok" target="_blank" rel="noopener" hidden>TikTokを見る</a>
</nav>

<!-- 日記1件の場所。js/diary_entry_view.js が中身を入れる -->
<main id="diary-entry"></main>

<!-- 注意書き（ツールの注意書き＋日記の注意書き）。文言を変えるときは、ここと diary/index.html の両方を直す -->
<footer class="note d-page-note">
  <p>このサイトのツールは、入力された数字をもとに計算するだけのものです。特定の商品や売買をすすめるものではなく、将来の結果を約束するものでもありません。計算は端末の中だけで行い、入力内容はどこにも送信されません。実際の判断はご自身の責任で、必要に応じて専門家にご相談ください。</p>
  <p>この日記は、AIを使った役員会議の記録を、公開用に書き直したものです。金額などの数字は伏せています。登場する役員はAIのキャラクターです。特定の商品や売買をすすめるものではありません。</p>
</footer>

<!-- 読み込む順番に意味がある：設定 → 部品 → 表示 → 最後に流れ（diary_entry_main.js） -->
<script src="../js/site_config.js"></script>
<script src="../js/link_button.js"></script>
<script src="../js/diary_day.js"></script>
<script src="../js/diary_safety.js"></script>
<script src="../js/diary_speakers.js"></script>
<script src="../js/diary_validate.js"></script>
<script src="../js/diary_validate_story.js"></script>
<script src="../js/diary_format.js"></script>
<script src="../js/diary_pick.js"></script>
<script src="../js/diary_load.js"></script>
<script src="../js/diary_parts.js"></script>
<script src="../js/diary_hook_view.js"></script>
<script src="../js/diary_entry_view.js"></script>
<script src="../js/diary_figure_view.js"></script>
<script src="../js/diary_story_view.js"></script>
<script src="../js/diary_entry_main.js"></script>
</body>
</html>
