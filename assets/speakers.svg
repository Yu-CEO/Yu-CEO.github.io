<svg xmlns="http://www.w3.org/2000/svg">
<!--
  speakers.svg：日記の話者9人の顔イラスト（このサイトのためのオリジナル。外部の画像は使っていない）
  1人ずつ symbol（使い回せる絵）にしてあり、<use href="assets/speakers.svg#aoi"> の形で呼び出す。
  どの話者がどの絵かは js/diary_speakers.js の決まった表で決める（日記のデータから絵の名前を決めない）。
  絵柄のそろえ方：丸の背景（話者の色）は CSS が塗る／髪は夜の紺（Yu だけ銀髪）／肌・服・目・口は全員同じ色と太さ。
-->
